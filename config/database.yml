default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: looped_api_development
  username: looped_api
  password: <%= ENV["LOOPED_API_DATABASE_PASSWORD"] %>
  host: 127.0.0.1
  port: 5432

test:
  <<: *default
  database: looped_api_test
  username: looped_api_test
  password: choose_a_strong_password
  host: 127.0.0.1
  port: 5432

production:
  <<: *default
  database: looped_api_production
  username: looped_api
  password: <%= ENV["LOOPED_API_DATABASE_PASSWORD"] %>
